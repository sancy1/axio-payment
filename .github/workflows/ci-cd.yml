name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - Build and Push to Docker Registry"]
    types:
      - completed

concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check CI result
        run: |
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Deploy only if CI succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          curl --fail --request POST \
            --url "$RENDER_DEPLOY_HOOK_URL" \
            --header "Content-Type: application/json"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Skip log (when CI failed)
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "⛔ CI failed — skipping Render deploy"

      - name: Success log
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "✅ Deployment triggered successfully"
          echo "📡 Render dashboard: https://dashboard.render.com"
