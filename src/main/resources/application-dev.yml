server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  sql:
    init:
      mode: never

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:Nd+/W0t/O9O6+TId5eB6W779m02ar5gf+Y13JBvSCuE=}
  expiration: ${JWT_EXPIRATION:604800000}

logging:
  level:
    com.axioquan.payment_service: DEBUG