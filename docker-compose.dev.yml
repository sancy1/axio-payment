version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payment-service-db
    environment:
      POSTGRES_DB: axio_prod
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_U8q4DIVoXdpL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
